{# Iconos de redes sociales (SVG inline, sin dependencias). Uso: {% include "components/social_icon.html" with icon="instagram" %} #}
<svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if icon == "instagram" %}
    <rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" />
  {% elif icon == "facebook" %}
    <path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z" />
  {% elif icon == "tripadvisor" %}
    <circle cx="7" cy="13" r="3.5" /><circle cx="17" cy="13" r="3.5" /><circle cx="7" cy="13" r="0.8" fill="currentColor" /><circle cx="17" cy="13" r="0.8" fill="currentColor" /><path d="M3.5 9.5C6 7.5 9 6.5 12 6.5s6 1 8.5 3M12 6.5 10.5 9M12 6.5 13.5 9" />
  {% else %}
    <circle cx="12" cy="12" r="9" />
  {% endif %}
</svg>
